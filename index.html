<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inconsolata:wght@300;400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #080b11;
  --ink:      #0c1018;
  --panel:    #111620;
  --rim:      #1e2840;
  --blurple:  #5865F2;
  --blurple-h:#6d79ff;
  --glow:     rgba(88,101,242,.35);
  --text:     #dde4f0;
  --muted:    #5a6680;
  --accent:   #57F287;
  --mono:     'Inconsolata', monospace;
  --sans:     'Syne', sans-serif;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  overflow-x: hidden;
  cursor: default;
}

/* ── Canvas bg ─────────────────────────────────────── */
#cvs {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .55;
}

/* ── Noise overlay ─────────────────────────────────── */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  opacity: .025;
}

/* ── Main wrap ─────────────────────────────────────── */
.wrap {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
}

/* ── Tag line ──────────────────────────────────────── */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--rim);
  background: var(--panel);
  padding: 5px 14px;
  border-radius: 40px;
  margin-bottom: 40px;
  opacity: 0;
  animation: rise .6s .1s ease forwards;
}

.tag .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
  animation: pulse 2s ease infinite;
}

@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: .4; }
}

/* ── Hero name ─────────────────────────────────────── */
.hero-name {
  font-size: clamp(64px, 13vw, 128px);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -.03em;
  text-align: center;
  margin-bottom: 28px;
  padding: 0 16px 12px;
  opacity: 0;
  animation: rise .7s .2s ease forwards;
  position: relative;
  overflow: visible;
}

.hero-name .letter {
  display: inline-block;
  background: linear-gradient(160deg, #ffffff 30%, #8891c8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  transition: transform .2s ease;
  padding-bottom: 6px;
}

.hero-name .letter:hover {
  transform: translateY(-6px) scale(1.05);
}

/* ── Subtitle ──────────────────────────────────────── */
.subtitle {
  font-family: var(--mono);
  font-size: 15px;
  color: var(--muted);
  text-align: center;
  max-width: 420px;
  line-height: 1.7;
  margin-bottom: 56px;
  opacity: 0;
  animation: rise .7s .35s ease forwards;
}

.subtitle em {
  font-style: normal;
  color: #7d89cc;
}

/* ── CTA buttons ───────────────────────────────────── */
.cta {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
  opacity: 0;
  animation: rise .7s .5s ease forwards;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 600;
  padding: 15px 32px;
  border-radius: 12px;
  text-decoration: none;
  cursor: pointer;
  border: none;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  position: relative;
  overflow: hidden;
  letter-spacing: .01em;
}

.btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.12) 0%, transparent 50%);
  pointer-events: none;
}

.btn:active { transform: scale(.97); }

/* Primary — add to server */
.btn-primary {
  background: var(--blurple);
  color: #fff;
  box-shadow: 0 0 0 0 var(--glow), 0 4px 20px rgba(88,101,242,.3);
}

.btn-primary:hover {
  background: var(--blurple-h);
  transform: translateY(-2px);
  box-shadow: 0 0 0 6px rgba(88,101,242,.12), 0 8px 32px rgba(88,101,242,.45);
}

/* Secondary — docs */
.btn-secondary {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--rim);
  box-shadow: 0 2px 12px rgba(0,0,0,.3);
}

.btn-secondary:hover {
  background: var(--rim);
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(0,0,0,.4);
  border-color: #2f3e5e;
}

.btn-icon {
  font-size: 18px;
  line-height: 1;
}

/* ── Features strip ────────────────────────────────── */
.features {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin-top: 72px;
  opacity: 0;
  animation: rise .7s .65s ease forwards;
}

.feat {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--panel);
  border: 1px solid var(--rim);
  border-radius: 30px;
  padding: 8px 16px;
  font-size: 13px;
  color: var(--muted);
  font-family: var(--mono);
  transition: border-color .2s, color .2s;
}

.feat:hover {
  border-color: #3a4f78;
  color: #8899bb;
}

.feat .fi { font-size: 15px; }


/* ── Animations ────────────────────────────────────── */
@keyframes rise {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .cta { flex-direction: column; align-items: center; }
  .btn { width: 100%; justify-content: center; }
  .features { gap: 8px; }
}
</style>

</style>
<script data-public-script>
(() => {
  document.documentElement.dataset.siteDesign='classic';
  document.addEventListener('DOMContentLoaded',()=>{
    const updateKey = 'elancag-public-update-3.3.0';
    let updateSeen = false;
    try { updateSeen = localStorage.getItem(updateKey) === 'seen'; } catch {}
    if (!updateSeen) {
      const notice = document.createElement('aside');
      notice.className = 'site-update';
      notice.setAttribute('aria-label', 'Обновление Elancag');
      notice.innerHTML = '<strong>Elancag обновился до 3.3.0</strong><p>Обновили классический дизайн и мобильную навигацию. Команды в документации расположены по необходимым правам доступа.</p><div><a href="./docs.html">Открыть документацию</a><button type="button">Понятно</button></div>';
      notice.querySelector('button').addEventListener('click', () => notice.remove());
      document.body.append(notice);
      try { localStorage.setItem(updateKey, 'seen'); } catch {}
    }
    const menuToggle = document.querySelector('.public-menu-toggle');
    if (menuToggle) {
      const header = menuToggle.closest('.public-topbar');
      const mobile = matchMedia('(max-width: 720px)');
      const setMenuOpen = open => menuToggle.setAttribute('aria-expanded', String(open));
      header.classList.add('has-mobile-menu');
      menuToggle.addEventListener('click', () => setMenuOpen(menuToggle.getAttribute('aria-expanded') === 'false'));
      document.addEventListener('click', event => {
        if (!header.contains(event.target)) setMenuOpen(false);
      });
      header.addEventListener('focusout', event => {
        if (event.relatedTarget && !header.contains(event.relatedTarget)) setMenuOpen(false);
      });
      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape' || menuToggle.getAttribute('aria-expanded') !== 'true') return;
        setMenuOpen(false);
        menuToggle.focus();
      });
      mobile.addEventListener('change', () => setMenuOpen(false));
    }
    const docsMenu = document.querySelector('.docs-menu');
    if (docsMenu) {
      const navigation = document.getElementById(docsMenu.getAttribute('aria-controls'));
      const setOpen = open => {
        navigation.classList.toggle('is-open', open);
        docsMenu.setAttribute('aria-expanded', String(open));
      };
      docsMenu.addEventListener('click', () => setOpen(!navigation.classList.contains('is-open')));
      navigation.addEventListener('keydown', event => {
        if (event.key === 'Escape' && navigation.classList.contains('is-open')) {
          setOpen(false);
          docsMenu.focus();
        }
      });
      navigation.addEventListener('click', event => {
        const link = event.target.closest('a[href^="#"]');
        if (!link || !navigation.classList.contains('is-open') ||
            event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        const section = document.getElementById(link.hash.slice(1));
        setOpen(false);
        const destination = section?.querySelector('.cmd-header') ?? section;
        if (!destination) return;
        if (!destination.matches('button')) destination.tabIndex = -1;
        requestAnimationFrame(() => destination.focus({ preventScroll: true }));
      });
    }
    document.querySelectorAll('.cmd-header').forEach((header,index)=>{
      const body=header.closest('.cmd-card').querySelector('.cmd-body');
      body.id=body.id||'command-details-'+index;
      header.setAttribute('aria-controls',body.id);
      header.setAttribute('aria-expanded',String(header.closest('.cmd-card').classList.contains('open')));
    });
  });
})();
</script>
